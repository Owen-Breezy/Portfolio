<!DOCTYPE html>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Helvetica, Arial, sans-serif; }

.btns a { text-decoration:none; padding:14px 28px; border-radius:10px; font-weight:800; font-size:15px; border:2px solid #fff; transition:.25s; }
.primary { background:#fff; color:#000; }
.primary:hover { background:#ffd700; border-color:#ffd700; box-shadow:0 0 25px rgba(255,215,0,.5); transform:translateY(-2px); }
.secondary { background:transparent; color:#fff; backdrop-filter:blur(10px); }
